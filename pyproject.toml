[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-mcp-gateway"
version = "0.1.0"
description = "A reproducible MCP gateway inspired by Scaling LLM Agent Tool Access"
requires-python = ">=3.12"
dependencies = ["mcp>=1.29,<2", "starlette>=0.40,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "jsonschema>=4.23,<5", "numpy>=1.26,<3", "redis>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1", "setuptools>=68", "wheel>=0.43"]

[project.scripts]
mcp-gateway = "mcp_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: real Redis and independent service processes", "functional: real HTTP and MCP SDK clients"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
